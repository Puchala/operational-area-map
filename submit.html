<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operational Area Submission</title>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Loading Operational Area Submission Tool…</p>
  <script>
    // Pin the known-good full submission tool to a real Git commit. The previous
    // value was a blob SHA, which raw.githubusercontent.com cannot serve as a ref.
    const SOURCE = 'https://raw.githubusercontent.com/Puchala/operational-area-map/1c9051c49eec9511dc488262b3c7ad6d1463c8da/submit.html';

    function toBase64Url(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = '';
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    fetch(SOURCE, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`Unable to load submission tool (${response.status}).`);
        return response.text();
      })
      .then(html => {
        const oldBuild = /  function buildSubmissionText\(\) \{[\s\S]*?\n  \}\n  function updateSubmissionButtons/;
        const newBuild = `  function getSubmissionPayload() {
    if (!getCircleLayers().length && !getSelectedNonCircleLayer()) return null;
    const payload = {
      version: 1,
      submission_type: 'operational_area',
      operator_id: document.getElementById('operatorId').value.trim(),
      site_id: document.getElementById('siteId').value.trim(),
      site_area_id: document.getElementById('siteId').value.trim(),
      metro_locality: document.getElementById('metroLocality').value.trim(),
      center_point: centerPointInput.value,
      geographic_bounds: boundsInput.value,
      coordination_contact: {
        name: document.getElementById('contactName').value.trim(),
        email: document.getElementById('contactEmail').value.trim(),
        phone: document.getElementById('contactPhone').value.trim()
      },
      coordination_contact_name: document.getElementById('contactName').value.trim(),
      coordination_contact_email: document.getElementById('contactEmail').value.trim(),
      coordination_contact_phone: document.getElementById('contactPhone').value.trim(),
      effective_from: effectiveFrom.value,
      effective_to: effectiveTo.value,
      operational_area_definition: circleDefinition,
      geometry: circleDefinition ? null : JSON.parse(submissionGeometry.value),
      confirm_minimum_info: document.getElementById('minimumInfo').checked,
      authorized: document.getElementById('authorized').checked,
      confirmations: {
        minimum_information: document.getElementById('minimumInfo').checked,
        authorized: document.getElementById('authorized').checked
      }
    };
    return payload;
  }
  function buildSubmissionText() {
    const payload = getSubmissionPayload();
    if (!payload) return '';
    return '```json\\n' + JSON.stringify(payload, null, 2) + '\\n```';
  }
  function buildGitHubIssueBody() {
    const payload = getSubmissionPayload();
    if (!payload) return '';
    return '<!-- OPERATIONAL-AREA-SUBMISSION -->\\n\\n<!-- OAM2:' + toBase64Url(JSON.stringify(payload)) + ' -->';
  }
  function updateSubmissionButtons`;
        if (!oldBuild.test(html)) throw new Error('Submission builder block was not found.');
        html = html.replace(oldBuild, newBuild);

        const oldHandler = /  createGithubSubmission\.addEventListener\('click', \(\) => \{[\s\S]*?\n  \}\);/;
        const newHandler = `  createGithubSubmission.addEventListener('click', () => {
    try {
      const repoUrl = getGitHubRepositoryUrl();
      const title = encodeURIComponent('Operational Area Submission: ' + document.getElementById('siteId').value.trim());
      const body = encodeURIComponent(buildGitHubIssueBody());
      const template = encodeURIComponent('operational-area.md');
      window.open(repoUrl + '/issues/new?template=' + template + '&title=' + title + '&body=' + body, '_blank', 'noopener');
    } catch (error) {
      submissionStatus.style.display = 'block';
      submissionStatus.textContent = error.message;
    }
  });`;
        if (!oldHandler.test(html)) throw new Error('GitHub submission handler was not found.');
        html = html.replace(oldHandler, newHandler);

        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.body.innerHTML = '<p style="font-family:system-ui;padding:24px;color:#991b1b">' + error.message.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</p>';
      });
  </script>
</body>
</html>
