name: Validate Operational Areas

on:
  # Use pull_request_target for repository-generated submission branches so
  # validation can run automatically on PRs created by the submission bot.
  # The job is restricted to github-actions-created PRs and uses the PR head
  # only as data input; the workflow itself always comes from main.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "operational-areas/**/*.geojson"
      - "schema/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "operational-areas/**/*.geojson"
      - "schema/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema shapely

      - name: Validate operational areas
        run: python scripts/validate.py


  auto-merge-submission:
    needs: validate
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'submission/issue-') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated submission
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const latest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number
            });

            if (latest.data.draft) {
              throw new Error('Refusing to merge because the submission PR is still a draft.');
            }

            if (latest.data.state !== 'open') {
              core.info('Submission PR is no longer open; nothing to merge.');
              return;
            }

            if (latest.data.head.sha !== pr.head.sha) {
              throw new Error('PR head changed after validation started; refusing to merge stale validation.');
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: latest.data.title,
              commit_message: 'Automatically merged after successful CI validation.',
              sha: latest.data.head.sha
            });

            if (!merge.data.merged) {
              throw new Error('GitHub did not merge the validated submission: ' + merge.data.message);
            }

            core.info('Merged validated operational-area submission PR #' + pr.number + '.');
