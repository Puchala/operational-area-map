name: Process Operational Area Submission
run-name: Process operational area issue #${{ github.event.issue.number }}

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-submission:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '### Operator ID') &&
      contains(github.event.issue.body, '### Operational Area Geometry') &&
      contains(github.event.issue.body, '<!-- OPERATIONAL-AREA-SUBMISSION -->')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Process operational-area submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/process_operational_area_submission.py
