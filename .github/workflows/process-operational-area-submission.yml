name: Process Operational Area Submission

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       contains(github.event.issue.body, '### Operator ID') &&
       contains(github.event.issue.body, '### Operational Area Geometry'))
    runs-on: ubuntu-latest
    steps:
      - name: Create operational-area file and draft PR
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = process.env.ISSUE_BODY || '';
            const issueNumber = process.env.ISSUE_NUMBER;
            const issueTitle = process.env.ISSUE_TITLE;
            const issueUrl = process.env.ISSUE_URL;

            function field(label, required = false) {
              const re = new RegExp(`### ${label.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`);
              const m = body.match(re);
              const value = m ? m[1].trim() : '';
              if (required && !value) throw new Error(`Missing required field: ${label}`);
              return value;
            }

            function clean(value) {
              return value.replace(/\\r/g, '').trim();
            }

            const operatorId = clean(field('Operator ID', true));
            const siteId = clean(field('Site / Area ID', true));
            const metro = clean(field('Metro / Locality', true));
            let geometryRaw = clean(field('Operational Area Geometry', true));
            const centerRaw = clean(field('Center Point (optional)'));
            const boundsRaw = clean(field('Geographic Bounds (optional)'));
            const contactName = clean(field('Coordination Contact Name (optional)'));
            const contactEmail = clean(field('Coordination Contact Email (optional)'));
            const contactPhone = clean(field('Coordination Contact Phone (optional)'));
            const effectiveFrom = clean(field('Effective From (optional)'));
            const effectiveTo = clean(field('Effective To (optional)'));

            // GitHub issue forms may wrap code-block fields depending on rendering.
            geometryRaw = geometryRaw.replace(/^```(?:json)?\\s*/i, '').replace(/\\s*```$/i, '').trim();
            let geometry;
            try { geometry = JSON.parse(geometryRaw); }
            catch (e) { throw new Error('Operational Area Geometry is not valid JSON. Please use the drawing tool and paste its generated geometry.'); }
            if (!geometry || !['Polygon', 'MultiPolygon'].includes(geometry.type) || !Array.isArray(geometry.coordinates)) {
              throw new Error('Geometry must be a GeoJSON Polygon or MultiPolygon.');
            }

            function parseJsonOptional(raw, label) {
              if (!raw) return undefined;
              try { return JSON.parse(raw.replace(/^```(?:json)?\\s*/i, '').replace(/\\s*```$/i, '').trim()); }
              catch (e) { throw new Error(`${label} must be valid JSON.`); }
            }

            const centerPoint = centerRaw ? (() => {
              const parts = centerRaw.split(',').map(x => Number(x.trim()));
              if (parts.length !== 2 || parts.some(Number.isNaN)) throw new Error('Center Point must be latitude,longitude.');
              return { type: 'Point', coordinates: [parts[1], parts[0]] };
            })() : undefined;
            const bounds = parseJsonOptional(boundsRaw, 'Geographic Bounds');

            const safe = value => value.replace(/[^A-Za-z0-9._-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
            if (!safe(operatorId) || !safe(siteId)) throw new Error('Operator ID and Site / Area ID must contain usable filename characters.');

            const properties = {
              operator_id: operatorId,
              site_id: siteId,
              metro_locality: metro
            };
            if (centerPoint) properties.center_point = centerPoint;
            if (bounds) properties.geographic_bounds = bounds;
            if (contactName || contactEmail || contactPhone) {
              properties.coordination_contact = {};
              if (contactName) properties.coordination_contact.name = contactName;
              if (contactEmail) properties.coordination_contact.email = contactEmail;
              if (contactPhone) properties.coordination_contact.phone = contactPhone;
            }
            if (effectiveFrom) properties.effective_from = effectiveFrom;
            if (effectiveTo) properties.effective_to = effectiveTo;

            const feature = { type: 'Feature', properties, geometry };
            const path = `operational-areas/${safe(operatorId)}/${safe(siteId)}.geojson`;
            const branch = `submission/issue-${issueNumber}`;
            const repo = context.repo;
            const base = await github.rest.repos.get({ owner: repo.owner, repo: repo.repo });
            const mainRef = await github.rest.git.getRef({ owner: repo.owner, repo: repo.repo, ref: 'heads/main' });

            try {
              await github.rest.git.createRef({ owner: repo.owner, repo: repo.repo, ref: `refs/heads/${branch}`, sha: mainRef.data.object.sha });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            const content = JSON.stringify(feature, null, 2) + '\\n';
            let existing = null;
            try { existing = await github.rest.repos.getContent({ owner: repo.owner, repo: repo.repo, path, ref: branch }); } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner: repo.owner,
              repo: repo.repo,
              path,
              message: `Add operational area from submission #${issueNumber}`,
              content: Buffer.from(content).toString('base64'),
              branch,
              ...(existing ? { sha: existing.data.sha } : {})
            });

            const pr = await github.rest.pulls.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `Publish operational area: ${operatorId} / ${siteId}`,
              head: branch,
              base: 'main',
              draft: true,
              body: `## Automated operational-area submission\\n\\nThis draft PR was generated from [Issue #${issueNumber}](${issueUrl}).\\n\\n### Proposed area\\n- **Operator:** \\`${operatorId}\\`\\n- **Site / Area:** \\`${siteId}\\`\\n- **Metro / Locality:** ${metro}\\n- **Source:** Operator submission form\\n\\n### Review checklist\\n- [ ] Geometry is correct and represents only the intended operational area.\\n- [ ] Minimum-necessary information principle is satisfied.\\n- [ ] No routes, trajectories, customer data, volumes, or sensitive strategy are included.\\n- [ ] Contact information is appropriate for publication.\\n- [ ] Effective dates are correct, if supplied.\\n- [ ] Automated validation passes.\\n- [ ] Potential overlap has been reviewed as an awareness signal only.\\n\\n**Publication is not automatic. A maintainer must review and merge this PR.**`
            });

            await github.rest.issues.update({ owner: repo.owner, repo: repo.repo, issue_number: Number(issueNumber), state: 'closed', state_reason: 'completed' });
            await github.rest.issues.createComment({ owner: repo.owner, repo: repo.repo, issue_number: Number(issueNumber), body: `✅ Submission processed. A draft Pull Request has been created: #${pr.data.number}. The area will not be published until the PR passes validation and is reviewed/merged.` });
            core.info(`Created draft PR #${pr.data.number}: ${pr.data.html_url}`);
