name: Build and Publish Operational Area Map

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "operational-areas/**/*.geojson"
      - "scripts/build_map_data.py"
      - ".github/workflows/build-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install shapely

      - name: Build shared GeoJSON
        run: python scripts/build_map_data.py --output map/operational-areas.geojson

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp map/operational-areas.geojson _site/operational-areas.geojson

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
