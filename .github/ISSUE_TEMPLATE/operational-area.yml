name: Submit Operational Area
description: Publish minimum necessary operational-area information for geographic overlap awareness.
title: "Operational Area: "

body:
  - type: markdown
    attributes:
      value: |
        ## Operational area submission

        Submit only the minimum information needed for geographic overlap awareness.
        This creates a draft Pull Request for automated validation and human review.

        Do not include routes, trajectories, customers, flight volumes, detailed operational strategies, or other commercially sensitive information.

  - type: input
    id: operator_id
    attributes:
      label: Operator ID
      description: Stable identifier for the publishing operator.
      placeholder: OPERATOR-001
    validations:
      required: true

  - type: input
    id: site_id
    attributes:
      label: Site / Area ID
      description: Stable identifier for this operational area.
      placeholder: SJC-NORTH-01
    validations:
      required: true

  - type: input
    id: metro_locality
    attributes:
      label: Metro / Locality
      description: Human-readable geographic context.
      placeholder: San Jose, CA
    validations:
      required: true

  - type: textarea
    id: geometry
    attributes:
      label: Operational Area Geometry
      description: Paste the Polygon or MultiPolygon geometry generated by the drawing tool. Do not paste a Feature or FeatureCollection.
      placeholder: '{"type":"Polygon","coordinates":[...]}'
    validations:
      required: true

  - type: input
    id: center_point
    attributes:
      label: Center Point (optional)
      description: Decimal latitude,longitude.
      placeholder: 37.355,-121.915

  - type: textarea
    id: geographic_bounds
    attributes:
      label: Geographic Bounds (optional)
      description: JSON object with south, west, north, east.
      placeholder: '{"south":37.34,"west":-121.93,"north":37.37,"east":-121.90}'

  - type: input
    id: contact_name
    attributes:
      label: Coordination Contact Name (optional)
      placeholder: Name

  - type: input
    id: contact_email
    attributes:
      label: Coordination Contact Email (optional)
      placeholder: ops@example.com

  - type: input
    id: contact_phone
    attributes:
      label: Coordination Contact Phone (optional)
      placeholder: +1-555-010-0000

  - type: input
    id: effective_from
    attributes:
      label: Effective From (optional)
      description: ISO 8601 date/time.
      placeholder: 2026-09-18T00:00:00Z

  - type: input
    id: effective_to
    attributes:
      label: Effective To (optional)
      description: ISO 8601 date/time.
      placeholder: 2026-12-31T23:59:59Z

  - type: checkboxes
    id: confirmation
    attributes:
      label: Publication confirmation
      options:
        - label: I confirm this submission contains only minimum necessary information for geographic overlap awareness and no sensitive operational details.
          required: true
        - label: I confirm I am authorized to publish this operational-area information on behalf of the operator.
          required: true
