name: Operational Area Submission
description: Submit an operational area for geographic overlap awareness.
title: "Operational Area: "
body:
  - type: markdown
    attributes:
      value: |
        Submit only the minimum information needed for geographic overlap awareness.
        Do not include routes, trajectories, customers, flight volumes, detailed operational strategies, or other commercially sensitive information.

  - type: input
    id: operator-id
    attributes:
      label: Operator ID
      description: Stable identifier for the publishing operator.
      placeholder: OPERATOR-001
    validations:
      required: true

  - type: input
    id: site-id
    attributes:
      label: Site / Area ID
      description: Stable identifier for this operational area.
      placeholder: SJC-NORTH-01
    validations:
      required: true

  - type: input
    id: metro-locality
    attributes:
      label: Metro / Locality
      description: Human-readable geographic context.
      placeholder: San Jose, CA
    validations:
      required: true

  - type: textarea
    id: geometry
    attributes:
      label: Operational Area Geometry
      description: GeoJSON Polygon or MultiPolygon generated by the drawing tool. For circles, this field may be left empty because the circle definition below is used to generate the polygon.
      placeholder: '{"type":"Polygon","coordinates":[...]}'

  - type: textarea
    id: operational-area-definition
    attributes:
      label: Operational Area Definition
      description: For a circular area, provide the generated center point and radius in meters.
      placeholder: '{"type":"Circle","center_point":{"latitude":37.355,"longitude":-121.915},"radius_meters":1000}'

  - type: input
    id: center-point
    attributes:
      label: Center Point
      description: Decimal latitude,longitude.
      placeholder: 37.355,-121.915

  - type: textarea
    id: geographic-bounds
    attributes:
      label: Geographic Bounds
      description: JSON object with south, west, north, east.
      placeholder: '{"south":37.34,"west":-121.93,"north":37.37,"east":-121.90}'

  - type: input
    id: contact-name
    attributes:
      label: Coordination Contact Name
      description: Optional coordination contact.
      placeholder: Name

  - type: input
    id: contact-email
    attributes:
      label: Coordination Contact Email
      description: Optional coordination contact.
      placeholder: ops@example.com

  - type: input
    id: contact-phone
    attributes:
      label: Coordination Contact Phone
      description: Optional coordination contact.
      placeholder: +1-555-010-0000

  - type: input
    id: effective-from
    attributes:
      label: Effective From
      description: Optional effective date/time.
      placeholder: 2026-09-18T00:00:00Z

  - type: input
    id: effective-to
    attributes:
      label: Effective To
      description: Optional effective date/time.
      placeholder: 2026-12-31T23:59:59Z

  - type: checkboxes
    id: confirmation
    attributes:
      label: Publication confirmation
      options:
        - label: I confirm this submission contains only minimum necessary information for geographic overlap awareness and no sensitive operational details.
          required: true
        - label: I confirm I am authorized to publish this operational-area information on behalf of the operator.
          required: true
